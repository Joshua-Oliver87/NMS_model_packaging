name: Build Python Wheel

on:
  push:
    branches: [ Josh_recent ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml   # now it exists

      - name: Clean previous builds
        run: rm -rf build dist ./*.egg-info */*.egg-info

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build wheel (PEP 517)
        run: python -m build --wheel

      - name: Smoke-test install
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import crop_model, sys; print('crop_model import OK on', sys.version)"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
